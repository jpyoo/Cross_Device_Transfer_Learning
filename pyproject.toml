[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stone-equilibria"
version = "1.0.0"
description = "Cross-device transfer learning for Grad-Shafranov equilibria via neural operators"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Jay Phil Yoo" },
    { name = "William Howes" },
    { name = "Syed Bahauddin Alam", email = "alams@illinois.edu" },
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "tqdm>=4.64",
]

[project.optional-dependencies]
data = ["jax>=0.4.13", "jaxlib>=0.4.13", "sympy>=1.12"]
graph = ["torch-geometric>=2.3", "networkx>=3.0"]
wavelet = ["PyWavelets>=1.4", "ptwt>=0.1.8", "pytorch-wavelets>=1.3.0"]

[tool.setuptools.packages.find]
include = ["stone*"]
